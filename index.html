<!-- ===================== Cabeceras de seguridad (aplicadas vía meta; ver notas al final del archivo sobre lo que meta SÍ y NO puede hacer) ===================== -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src 'self'; img-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; script-src 'none'; upgrade-insecure-requests">
<meta http-equiv="Referrer-Policy" content="no-referrer">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

<!--
  ===================== Notas de seguridad =====================
  Controles aplicados en esta página (alineados a OWASP Top 10, ISO/IEC 27001
  Anexo A e ideas de NIST SP 800-53):

   - Content-Security-Policy estricta: no se permite ningún script (script-src
     'none'), ni objetos/plugins (object-src 'none'), ni carga de recursos de
     otros orígenes (default-src 'none' + cada directiva limitada a 'self').
     Esto elimina prácticamente la superficie de ataque de XSS/inyección de
     contenido (OWASP A03:2021 - Injection / A05:2021 - Security Misconfiguration).
   - form-action 'none' y base-uri 'none': no hay formularios ni posibilidad
     de redirigir el <base> del documento.
   - Referrer-Policy: no-referrer — no se filtra la URL de esta invitación
     (que podría revelar datos del evento) a servidores de terceros.
   - robots noindex/nofollow/noarchive — la página no debe ser indexada ni
     cacheada por buscadores, para minimizar la exposición de datos
     personales del menor/familia (alineado al principio de minimización de
     datos de la Ley 29733 de Protección de Datos Personales del Perú).
   - Sin JavaScript, sin dependencias externas (fuentes, CDNs, analytics):
     reduce la cadena de suministro (supply chain) a cero terceros, buena
     práctica de NIST SP 800-53 (SA-11 / SR-3) y OWASP (minimizar dependencias).
   - Todos los recursos (video, poster, CSS) se sirven en el mismo origen
     (same-origin), sin llamadas externas.

  Limitación conocida (transparencia, no se oculta):
   - GitHub Pages es hosting 100% estático y NO permite configurar cabeceras
     HTTP reales a nivel de servidor (no existe un archivo tipo _headers).
     Por especificación del navegador, algunas protecciones SOLO funcionan si
     llegan como cabecera HTTP real y el navegador las IGNORA si se ponen
     como <meta> — no las incluí para no aparentar una protección que en la
     práctica no aplica:
       · X-Frame-Options y la directiva frame-ancestors del CSP
         (protección anti-clickjacking)
       · X-Content-Type-Options: nosniff
       · Strict-Transport-Security (HSTS) — aunque igual no hace falta
         aquí: GitHub Pages ya fuerza HTTPS en *.github.io por su cuenta.
       · Permissions-Policy
     Lo que SÍ funciona como <meta> y queda activo en esta página:
     Content-Security-Policy (excepto frame-ancestors), Referrer-Policy y
     robots noindex.
     Si más adelante quieres esas cabeceras reales (defensa en profundidad
     completa), la alternativa gratuita es mover este mismo sitio a
     Cloudflare Pages, que sí permite fijar cabeceras HTTP de verdad con un
     archivo _headers. Puedo prepararte esa migración si la quieres.
-->
