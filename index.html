<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isabella Sofía — Invitación</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500&display=swap');

  :root{
    --bg1:#eef3e0;
    --bg2:#fbf6ea;
    --text:#5a6b4a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    min-height:100vh; min-height:100dvh;
    background:linear-gradient(160deg, var(--bg1), var(--bg2));
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:28px 16px;
    font-family:'Poppins', sans-serif;
  }

  .title{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    color:var(--text);
    font-size:clamp(28px, 8vw, 40px);
    text-align:center;
    margin:0 0 4px;
  }
  .subtitle{
    color:var(--text);
    opacity:.75;
    font-size:clamp(12px, 3.4vw, 14px);
    letter-spacing:.04em;
    text-align:center;
    margin:0 0 22px;
    text-transform:uppercase;
  }

  .card{
    width:100%;
    max-width:380px;
    aspect-ratio:9/16;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 18px 40px rgba(90,107,74,.25), 0 2px 8px rgba(90,107,74,.15);
    background:#000;
  }
  video{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .hint{
    margin-top:18px;
    color:var(--text);
    opacity:.65;
    font-size:13px;
    text-align:center;
  }
</style>
</head>
<body>

  <p class="title">Baby Isabella Sofía</p>
  <p class="subtitle">Nos encantaría contar contigo</p>

  <div class="card">
    <video
      src="BSIsabella.mp4"
      poster="video_poster.jpg"
      controls
      playsinline
      preload="metadata"
    >
      Tu navegador no soporta la reproducción de video.
    </video>
  </div>

  <p class="hint">Toca ▶ para ver la invitación</p>

</body>
</html>
